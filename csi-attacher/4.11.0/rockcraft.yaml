# Based on: https://github.com/kubernetes-csi/external-attacher/blob/v4.11.0/Dockerfile
name: csi-attacher
summary: csi-attacher rock
description: |
    A rock containing csi-attacher.

    The external-attacher is a sidecar container that attaches volumes to nodes
    by calling ControllerPublish and ControllerUnpublish functions of CSI drivers.
    It is necessary because internal Attach/Detach controller running in Kubernetes
    controller-manager does not have any direct interfaces to CSI drivers.
license: Apache-2.0
version: 4.11.0

base: bare
build-base: ubuntu@24.04

platforms:
  amd64:
  arm64:

environment:
  APP_VERSION: 4.11.0

# Services to be loaded by the Pebble entrypoint.
services:
  csi-attacher:
    summary: "csi-attacher service"
    override: replace
    startup: enabled
    command: "/csi-attacher [ --help ]"
    on-success: shutdown
    on-failure: shutdown

entrypoint-service: csi-attacher

parts:
  # `base: bare` stages no base-files, and since the Ubuntu 24.04 /usr-merge the
  # libc6 deb no longer carries the top-level /lib and /lib64 compatibility
  # symlinks itself. Without them the ELF interpreter
  # (/lib64/ld-linux-x86-64.so.2 on amd64, /lib/ld-linux-aarch64.so.1 on arm64)
  # does not resolve and every binary in the rock, pebble included, dies with
  # "no such file or directory".
  usr-merge:
    plugin: nil
    override-prime: |
      craftctl default
      # No-ops on a build-base that already provides them, so this part stays
      # correct if it is carried over to another base.
      [ -e "${CRAFT_PRIME}/lib" ] || ln -s usr/lib "${CRAFT_PRIME}/lib"
      if [ "${CRAFT_ARCH_BUILD_FOR}" = "amd64" ]; then
        [ -e "${CRAFT_PRIME}/lib64" ] || ln -s usr/lib64 "${CRAFT_PRIME}/lib64"
      fi
  build-csi-attacher:
    after: [pebble]
    plugin: go
    source: https://github.com/kubernetes-csi/external-attacher.git
    source-type: git
    source-tag: v${CRAFT_PROJECT_VERSION}
    source-depth: 1
    override-build: |
      snap refresh go --channel=1.25/stable
      craftctl default
    build-environment:
      - CGO_ENABLED: 0
      - GOOS: linux
      - GOARCH: $CRAFT_ARCH_BUILD_FOR
      - VERSION: $CRAFT_PROJECT_VERSION
      - LDFLAGS: >
          -X main.version=${VERSION} -extldflags "-static"
    go-buildtags:
      - "mod=vendor"
    go-generate:
      - ./cmd/csi-attacher
    organize:
      bin/csi-attacher: ./
