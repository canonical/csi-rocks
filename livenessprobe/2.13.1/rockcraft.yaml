# Based on: https://github.com/kubernetes-csi/livenessprobe/blob/v2.13.1/Dockerfile
name: livenessprobe
summary: livenessprobe rock
description: |
    A rock containing livenessprobe.

    The liveness probe is a sidecar container that exposes an HTTP /healthz endpoint,
    which serves as kubelet's livenessProbe hook to monitor health of a CSI driver.
license: Apache-2.0
version: 2.13.1

base: bare
build-base: ubuntu@22.04

platforms:
  amd64:
  arm64:

environment:
  APP_VERSION: 2.13.1

# Services to be loaded by the Pebble entrypoint.
services:
  livenessprobe:
    summary: "livenessprobe service"
    override: replace
    startup: enabled
    command: "/livenessprobe [ --help ]"
    on-success: shutdown
    on-failure: shutdown

entrypoint-service: livenessprobe

parts:
  openssl:
    plugin: nil
    stage-packages:
      - openssl-fips-module-3 # a Pro only FIPS package for openssl
      - openssl # now automatically selected from fips-preview
  build-livenessprobe:
    after: [pebble]
    plugin: go
    source: https://github.com/kubernetes-csi/livenessprobe.git
    source-type: git
    source-tag: v${CRAFT_PROJECT_VERSION}
    source-depth: 1
    override-build: |
      snap refresh go --channel=1.22-fips/stable
      craftctl default
    build-environment:
      - CGO_ENABLED: 1
      - GOOS: linux
      - GOARCH: $CRAFT_ARCH_BUILD_FOR
      - VERSION: $CRAFT_PROJECT_VERSION
      - GOTOOLCHAIN: local
      - GOEXPERIMENT: opensslcrypto
      - LDFLAGS: >
          -X main.version=${VERSION}
    go-buildtags:
      - "mod=vendor"
    go-generate:
      - ./cmd/livenessprobe
    organize:
      bin/livenessprobe: ./
