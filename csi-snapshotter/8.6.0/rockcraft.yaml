# Based on: https://github.com/kubernetes-csi/external-snapshotter/blob/v8.6.0/cmd/csi-snapshotter/Dockerfile
name: csi-snapshotter
summary: csi-snapshotter rock
description: |
    A rock containing the CSI snapshotter.
license: Apache-2.0
version: 8.6.0

base: bare
build-base: ubuntu@24.04

platforms:
  amd64:
  arm64:

environment:
  APP_VERSION: 8.6.0

# Services to be loaded by the Pebble entrypoint.
services:
  csi-snapshotter:
    summary: "csi-snapshotter service"
    override: replace
    startup: enabled
    command: "/csi-snapshotter [ --help ]"
    on-success: shutdown
    on-failure: shutdown

entrypoint-service: csi-snapshotter

parts:
  # `base: bare` stages no base-files, and since the Ubuntu 24.04 /usr-merge the
  # libc6 deb no longer carries the top-level /lib and /lib64 compatibility
  # symlinks itself. Without them the ELF interpreter
  # (/lib64/ld-linux-x86-64.so.2 on amd64, /lib/ld-linux-aarch64.so.1 on arm64)
  # does not resolve and every binary in the rock, pebble included, dies with
  # "no such file or directory".
  usr-merge:
    plugin: nil
    override-prime: |
      craftctl default
      # No-ops on a build-base that already provides them, so this part stays
      # correct if it is carried over to another base.
      [ -e "${CRAFT_PRIME}/lib" ] || ln -s usr/lib "${CRAFT_PRIME}/lib"
      if [ "${CRAFT_ARCH_BUILD_FOR}" = "amd64" ]; then
        [ -e "${CRAFT_PRIME}/lib64" ] || ln -s usr/lib64 "${CRAFT_PRIME}/lib64"
      fi
  openssl:
    plugin: nil
    stage-packages:
      - openssl-fips-module-3 # a Pro only FIPS package for openssl
      - openssl # now automatically selected from fips-preview
  csi-snapshotter:
    after: [pebble]
    plugin: go
    source: https://github.com/kubernetes-csi/external-snapshotter.git
    source-type: git
    source-tag: v${CRAFT_PROJECT_VERSION}
    source-depth: 1
    override-build: |
      # NOTE: (mateo) Use Go FIPS 1.26, to prevent Pebble from rolling 
      # back the version to the embedded version.

      snap refresh go --channel 1.26-fips/stable
      craftctl default
    build-environment:
      - CGO_ENABLED: 1
      - GOOS: linux
      - GOARCH: $CRAFT_ARCH_BUILD_FOR
      - VERSION: $CRAFT_PROJECT_VERSION
      - GOTOOLCHAIN: local
      - GOEXPERIMENT: opensslcrypto
      - LDFLAGS: >
          -X main.version=${VERSION}
    go-buildtags:
      - "mod=vendor"
      - ms_tls13kdf
    go-generate:
      - ./cmd/csi-snapshotter
    organize:
      bin/csi-snapshotter: ./
