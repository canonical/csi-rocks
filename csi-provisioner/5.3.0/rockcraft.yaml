# Based on: https://github.com/kubernetes-csi/external-provisioner/blob/v5.3.0/Dockerfile
name: csi-provisioner
summary: csi-provisioner rock
description: |
    A rock containing the CSI provisioner.

    The external-provisioner is a sidecar container that dynamically provisions
    volumes by calling `CreateVolume` and `DeleteVolume` functions of CSI drivers.
    It is necessary because internal persistent volume controller running in Kubernetes
    `controller-manager` does not have any direct interfaces to CSI drivers.
license: Apache-2.0
version: 5.3.0

base: bare
build-base: ubuntu@22.04

platforms:
  amd64:
  arm64:

environment:
  APP_VERSION: 5.3.0

# Services to be loaded by the Pebble entrypoint.
services:
  csi-provisioner:
    summary: "csi-provisioner service"
    override: replace
    startup: enabled
    command: "/csi-provisioner [ --help ]"
    on-success: shutdown
    on-failure: shutdown

entrypoint-service: csi-provisioner

parts:
  openssl:
    plugin: nil
    stage-packages:
      - openssl-fips-module-3 # a Pro only FIPS package for openssl
      - openssl # now automatically selected from fips-preview
  csi-provisioner:
    after: [pebble]
    plugin: go
    source: https://github.com/kubernetes-csi/external-provisioner.git
    source-type: git
    source-tag: v${CRAFT_PROJECT_VERSION}
    source-depth: 1
    override-build: |
      # NOTE: (mateo) Use Go FIPS 1.24, the project originally required
      # 1.21, but due to CRITICAL CVEs, this version was updated.

      snap refresh go --channel 1.24-fips/stable
      craftctl default
    build-environment:
      - CGO_ENABLED: 1
      - GOOS: linux
      - GOARCH: $CRAFT_ARCH_BUILD_FOR
      - VERSION: $CRAFT_PROJECT_VERSION
      - GOTOOLCHAIN: local
      - GOEXPERIMENT: opensslcrypto
      - LDFLAGS: >
          -X main.version=${VERSION}
    go-buildtags:
      - "mod=vendor"
      - ms_tls13kdf
    go-generate:
      - ./cmd/csi-provisioner
    organize:
      bin/csi-provisioner: ./
